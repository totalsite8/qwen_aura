<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Aura — персональный помощник по поиску товаров и услуг</title>
    <meta
      name="description"
      content="Aura понимает запрос, сравнивает варианты, проверяет надёжность и объясняет, почему выбрала лучшее. Поиск бесплатный."
    />
    <meta name="theme-color" content="#0a1210" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='30%25' r='75%25'%3E%3Cstop offset='0%25' stop-color='%237fe0c2'/%3E%3Cstop offset='55%25' stop-color='%230f8f7f'/%3E%3Cstop offset='100%25' stop-color='%230a3d33'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='%230a1210'/%3E%3Ccircle cx='32' cy='32' r='17' fill='url(%23g)'/%3E%3Cellipse cx='32' cy='32' rx='25' ry='8.5' fill='none' stroke='%23f0b45c' stroke-opacity='0.85' stroke-width='2.2' transform='rotate(-18 32 32)'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800&family=Golos+Text:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Тема до отрисовки, чтобы не было вспышки
      (function () {
        try {
          var stored = localStorage.getItem("aura-theme");
          var dark =
            stored === "dark" ||
            (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches) ||
            (stored === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = dark ? "#0a1210" : "#f3f6f4";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
